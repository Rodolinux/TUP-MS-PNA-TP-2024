<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listado de Stock</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        color: #333;
      }

      header {
        background-color: #007bff;
        color: white;
        padding: 1em;
        text-align: center;
      }

      h1 {
        font-size: 1.8em;
        margin-bottom: 0.5em;
      }

      .filters {
        margin-top: 1em;
        display: flex;
        justify-content: center;
        gap: 1em;
      }

      label {
        font-weight: bold;
      }

      select {
        padding: 0.5em;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      main {
        max-width: 800px;
        margin: 2em auto;
        padding: 1em;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1em;
      }

      th,
      td {
        padding: 1em;
        border: 1px solid #ddd;
        text-align: left;
      }

      th {
        background-color: #007bff;
        color: white;
      }

      tbody tr:nth-child(even) {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Listado de Stock</h1>
      <div class="filters">
        <label for="category">Categoría:</label>
        <select id="category" onchange="filterStock()">
          <option value="all">Todas</option>
          <option value="ingredientes">Ingredientes</option>
          <option value="almacen">Elementos de Almacén</option>
          <option value="limpieza">Elementos de Limpieza</option>
        </select>
        <label for="provider">Proveedor:</label>
        <select id="provider" onchange="filterStock()">
          <option value="all">Todos</option>
          <option value="A">Proveedor A</option>
          <option value="B">Proveedor B</option>
          <option value="C">Proveedor C</option>
        </select>
      </div>
    </header>
    <main>
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Proveedor</th>
            <th>Cantidad</th>
          </tr>
        </thead>
        <tbody id="stockList">
          <!-- Las filas de productos se completarán aquí con JavaScript -->
        </tbody>
      </table>
    </main>
    <script>
      // Datos harcodeados
      const stockData = [
        { product: "Arroz", category: "almacen", provider: "A", quantity: 50 },
        { product: "Aceite", category: "almacen", provider: "B", quantity: 30 },
        {
          product: "Detergente",
          category: "limpieza",
          provider: "C",
          quantity: 20,
        },
        {
          product: "Carne",
          category: "ingredientes",
          provider: "A",
          quantity: 15,
        },
        { product: "Papel", category: "almacen", provider: "B", quantity: 60 },
        {
          product: "Tomate",
          category: "ingredientes",
          provider: "C",
          quantity: 45,
        },
        { product: "Harina", category: "almacen", provider: "A", quantity: 40 },
        {
          product: "Desinfectante",
          category: "limpieza",
          provider: "B",
          quantity: 10,
        },
      ];

      // Función para rellenar la tabla de stock
      function displayStock(data) {
        const stockList = document.getElementById("stockList");
        stockList.innerHTML = "";
        data.forEach((item) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${item.product}</td>
            <td>${capitalize(item.category)}</td>
            <td>Proveedor ${item.provider}</td>
            <td>${item.quantity}</td>
        `;
          stockList.appendChild(row);
        });
      }

      // Filtrar datos de stock según filtros seleccionados
      function filterStock() {
        const category = document.getElementById("category").value;
        const provider = document.getElementById("provider").value;

        const filteredData = stockData.filter((item) => {
          return (
            (category === "all" || item.category === category) &&
            (provider === "all" || item.provider === provider)
          );
        });

        displayStock(filteredData);
      }

      // Función para poner en mayúscula la primera letra
      function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      // Inicializar tabla de stock con todos los datos
      document.addEventListener("DOMContentLoaded", () => {
        displayStock(stockData);
      });
    </script>
  </body>
</html>
