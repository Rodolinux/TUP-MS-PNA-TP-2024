<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABM de Recetas</title>
    <style>
      /* Contenido de styles.css */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
      }

      .container {
        max-width: 800px;
        margin: 20px auto;
        padding: 20px;
        background-color: #fff;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      header {
        text-align: center;
        margin-bottom: 20px;
      }

      .form-section,
      .table-section {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin: 8px 0 4px;
      }

      input,
      textarea,
      button,
      select {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      button {
        background-color: #28a745;
        color: white;
        border: none;
        cursor: pointer;
      }

      button:hover {
        background-color: #218838;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      table,
      th,
      td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
      }

      th {
        background-color: #f0f0f0;
      }

      .action-btn {
        background-color: #007bff;
        color: white;
        padding: 5px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .action-btn:hover {
        background-color: #0056b3;
      }

      .delete-btn {
        background-color: #dc3545;
      }

      .delete-btn:hover {
        background-color: #c82333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>ABM de Recetas</h1>
      </header>

      <!-- Formulario para agregar o editar recetas -->
      <section class="form-section">
        <h2>Agregar/Editar Receta</h2>
        <form id="recipeForm">
          <label for="recipeName">Nombre de la receta:</label>
          <input type="text" id="recipeName" required />

          <label for="recipeType">Tipo de receta:</label>
          <select id="recipeType">
            <option value="General">General</option>
            <option value="Veggie">Veggie</option>
            <option value="Protéico">Protéico</option>
            <option value="Vegano">Vegano</option>
            <option value="Liviano">Liviano</option>
            <option value="Adecuado a patologías">Adecuado a patologías</option>
          </select>

          <label for="ingredients">Ingredientes (separados por coma):</label>
          <input type="text" id="ingredients" required />

          <label for="instructions">Instrucciones:</label>
          <textarea id="instructions" required></textarea>

          <button type="submit">Guardar Receta</button>
        </form>
      </section>

      <!-- Tabla de recetas -->
      <section class="table-section">
        <h2>Lista de Recetas</h2>
        <table id="recipeTable">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Tipo</th>
              <th>Ingredientes</th>
              <th>Instrucciones</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Las recetas se añadirán aquí dinámicamente -->
          </tbody>
        </table>
      </section>
    </div>
    
    <script>
      let recipes = [];
      let editIndex = null;

      const recipeForm = document.getElementById("recipeForm");
      const recipeNameInput = document.getElementById("recipeName");
      const recipeType = document.getElementById("recipeType");
      const ingredientsInput = document.getElementById("ingredients");
      const instructionsInput = document.getElementById("instructions");
      const recipeTableBody = document
        .getElementById("recipeTable")
        .getElementsByTagName("tbody")[0];

      
      // Recetas por defecto
        const defaultRecipe1 = {
        name: "Tarta de jamón y queso",
        type: "General",
        ingredients:
          "1 tapa de tarta, 200 gr jamón, 200 gr queso, 3 huevos, 200 cc crema",
        instructions: `1.- Forrar un molde para tarta con la masa.\n2.- Colocar el jamón y el queso cortados en cubos.\n3.- Batir los huevos con la crema y condimentar.\n4.- Verter sobre la tarta.\n5.- Cocinar en horno precalentado a 180°C por 30 minutos.`,
      };

      const defaultRecipe2 = {
        name: "Ensalada de frutas",
        type: "Veggie",
        ingredients:
          "1 manzana, 1 banana, 1 naranja, 1 pera, 1 kiwi, 1 taza de uvas, 1 taza de frutillas",
        instructions: `1.- Lavar y pelar las frutas.\n2.- Cortarlas en cubos pequeños.\n3.- Mezclar todo en un bowl.\n4.- Servir frío.`,
      };

      // Agregar receta por defecto
        recipes.push(defaultRecipe1);
        recipes.push(defaultRecipe2);
        renderTable();
        recipeForm.reset();

      recipeForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const name = recipeNameInput.value;
        const type = recipeType.value;
        const ingredients = ingredientsInput.value;
        const instructions = instructionsInput.value;

        if (editIndex === null) {
          // Agregar nueva receta
          recipes.push({ name, type, ingredients, instructions });
        } else {
          // Editar receta existente
          recipes[editIndex] = { name, type, ingredients, instructions };
          editIndex = null;
        }

        renderTable();
        recipeForm.reset();
      });

      function renderTable() {
        recipeTableBody.innerHTML = ""; // Limpiar tabla

        recipes.forEach((recipe, index) => {
          const row = recipeTableBody.insertRow();

          row.innerHTML = `
            <td>${recipe.name}</td>
            <td>${recipe.type}</td>
            <td>${recipe.ingredients}</td>
            <td>${recipe.instructions}</td>
            <td>
                <button class="action-btn" onclick="editRecipe(${index})">Editar</button>
                <button class="action-btn delete-btn" onclick="deleteRecipe(${index})">Eliminar</button>
            </td>
        `;
        });
      }

      function editRecipe(index) {
        const recipe = recipes[index];
        recipeNameInput.value = recipe.name;
        recipeType.value = recipe.type;
        ingredientsInput.value = recipe.ingredients;
        instructionsInput.value = recipe.instructions;
        editIndex = index;
      }

      function deleteRecipe(index) {
        recipes.splice(index, 1);
        renderTable();
      }
    </script>
  </body>
</html>
